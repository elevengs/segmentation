[project]
name = "microsam-labeling"
dynamic = [
  "version"
]
requires-python = ">=3.10,<=3.12"
dependencies = [
    "micro-sam>=1.8.4",
    "mobile-sam",
    "napari[all]>=0.7.1",
    "nd2[legacy]>=0.11.3",
    "numba>=0.59",
    "pyqt5>=5.15.11",
]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux'",
]

[tool.uv.sources]
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git" }

[dependency-groups]
dev = [
]
